name: Release

# Builds the card from the tagged code and attaches ha-viark-remote-card.js to
# the release, which is the file HACS installs. The tests and the key-name check
# run first, so a release that fails them gets no file attached.
#
# HACS validation runs last, not first: for a dashboard card it looks for the
# file in the latest release, which this release only has once it is attached.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/tests.yml

  key-aliases:
    name: Key names
    needs: version
    uses: ./.github/workflows/key-aliases.yml

  release:
    name: Build and attach the card to the release
    needs: [tests, key-aliases]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload ha-viark-remote-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ha-viark-remote-card.js --clobber

  validate:
    name: Validate
    needs: release
    uses: ./.github/workflows/validate.yml
