name: Validate

# HACS and Hassfest, both required for inclusion in the HACS default list. The
# upstream examples also run nightly to catch rule changes; this repo changes
# rarely, so it validates on changes only. Run it by hand before a release or a
# HACS submission to get a fresh result against the current rules.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
