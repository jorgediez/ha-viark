name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: Pytest (HA ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported release, as in hacs.json. Dependabot only bumps
          # requirements_test.txt, so this pin stays put.
          - name: min  # 2025.3
            python: "3.13"
            harness: "pytest-homeassistant-custom-component==0.13.221"
          # Newest release, as pinned in requirements_test.txt.
          - name: latest
            python: "3.14"
            harness: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: |
          if [ -n "${{ matrix.harness }}" ]; then
            grep -v '^pytest-homeassistant-custom-component' requirements_test.txt > "$RUNNER_TEMP/requirements.txt"
            pip install "${{ matrix.harness }}" -r "$RUNNER_TEMP/requirements.txt"
          else
            pip install -r requirements_test.txt
          fi
      - run: pytest --cov --cov-report=term-missing

  # The remote card, in frontend/. Its jobs are named "Card ..." so they never
  # share a name with the integration's: the names are required checks.
  card-lint:
    name: Card lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  card-test:
    name: Card type check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage

  card-build:
    name: Card build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ha-viark-remote-card
          path: frontend/dist/ha-viark-remote-card.js

  # The card sends keys by name, and the names are KEY_ALIASES in const.py. A
  # change to either side has to update the card's copy in the same PR.
  card-key-names:
    name: Card key names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node frontend/scripts/check-key-aliases.mjs
